name: DaFeiYu
options:
  bundleIdPrefix: com.dafeiyu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    CLANG_ENABLE_MODULES: "YES"

packages:
  DFCore:
    path: Packages/DFCore
  DFData:
    path: Packages/DFData
  DFAI:
    path: Packages/DFAI

targets:
  DaFeiYu:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Features
    settings:
      base:
        PRODUCT_NAME: DaFeiYu
        PRODUCT_BUNDLE_IDENTIFIER: com.dafeiyu.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        DF_DISPLAY_NAME: 大肥鱼
        DF_ENVIRONMENT_NAME: production
    dependencies:
      - package: DFCore
        product: DFCore
      - package: DFData
        product: DFData
      - package: DFAI
        product: DFAI

  DaFeiYuLab:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Features
    settings:
      base:
        PRODUCT_NAME: DaFeiYuLab
        PRODUCT_BUNDLE_IDENTIFIER: com.dafeiyu.lab
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        DF_DISPLAY_NAME: 大肥鱼 Lab
        DF_ENVIRONMENT_NAME: lab
    dependencies:
      - package: DFCore
        product: DFCore
      - package: DFData
        product: DFData
      - package: DFAI
        product: DFAI

schemes:
  DaFeiYu:
    build:
      targets:
        DaFeiYu: all
    run:
      config: Debug
    archive:
      config: Release
  DaFeiYuLab:
    build:
      targets:
        DaFeiYuLab: all
    run:
      config: Debug
    archive:
      config: Release
