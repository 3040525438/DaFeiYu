# GitHub Actions：云端构建产物
#
# IPA 说明：本机是 Windows，IPA 必须在 macOS（Xcode）上构建，因此由本 workflow 的
# macOS runner 完成。产物为**未签名 IPA**（--no-codesign），可用于：
#   - TrollStore / AltStore / SideStore 等侧载工具自行签名安装；
#   - 或补充证书后在本地 Xcode 里归档签名。
# 触发：push 到 main 分支、手动 workflow_dispatch、版本 tag（v*）。
#
# 产物下载位置：仓库 Actions 页 → 对应 run → Artifacts。
name: Build Artifacts (Android APK + iOS IPA)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: iOS Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS archive (no codesign)
        run: flutter build ipa --release --no-codesign

      # xcarchive → 未签名 IPA：把 Runner.app 压成 Payload 包
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/Payload/
          cd build/ios
          zip -q -r DaFeiYu-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-unsigned-ipa
          path: build/ios/DaFeiYu-unsigned.ipa
