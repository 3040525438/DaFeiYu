name: core-tests

# Linux Runner 按 1x 计费（$0.006/分钟），用于日常纯逻辑单测，
# 避免消耗昂贵的 macOS 构建额度。
on:
  push:
    branches: ['**', '!ci-logs']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - name: 安装系统依赖
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 记录 Swift 版本
        run: swift --version

      - name: DFCore 单元测试
        run: swift test --package-path Packages/DFCore

      - name: DFAI 单元测试
        run: swift test --package-path Packages/DFAI

      - name: DFData 单元测试
        # 失败时把尾部日志写进 Job Summary / ci-logs 分支，便于无登录环境定位失败用例
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          swift test --package-path Packages/DFData 2>&1 | tee /tmp/dfdata.log
          status=${PIPESTATUS[0]:-1}
          echo "::notice title=DFDataStatus::exit=$status"
          if [ "$status" -ne 0 ]; then
            # 把日志尾部逐行转成注解，Annotations API 无需登录即可读取
            tail -n 12 /tmp/dfdata.log | while IFS= read -r line; do
              echo "::error title=DFDataTail::${line:0:800}"
            done
            grep -E "error: |Test Case .* failed|XCTAssert.*failed|Fatal error|Assertion failed|recorded an issue" /tmp/dfdata.log \
              | head -n 6 \
              | while IFS= read -r line; do
                  echo "::error title=DFData::${line:0:900}"
                done
            {
              echo '```'
              tail -n 150 /tmp/dfdata.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 同时把失败日志推到 ci-logs 分支，便于在无登录环境下定位（该分支已被 on.push 排除）
            git config --global user.name "ci-log"
            git config --global user.email "ci-log@users.noreply.github.com"
            git checkout -q --orphan ci-logs
            git rm -rq --cached . >/dev/null 2>&1 || true
            cp /tmp/dfdata.log ./dfdata-failure.log
            git add -f dfdata-failure.log
            git commit -q -m "ci: DFData 失败日志 ${GITHUB_SHA}"
            git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
          fi
          exit "$status"

