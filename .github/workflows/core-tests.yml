name: core-tests

# Linux Runner 按 1x 计费（$0.006/分钟），用于日常纯逻辑单测，
# 避免消耗昂贵的 macOS 构建额度。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - name: 安装系统依赖
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 记录 Swift 版本
        run: swift --version

      - name: DFCore 单元测试
        run: swift test --package-path Packages/DFCore

      - name: DFAI 单元测试
        run: swift test --package-path Packages/DFAI

      - name: DFData 单元测试
        # 容器内默认 shell 是 sh，这里显式用 bash 以便拿 PIPESTATUS；
        # 失败时把关键日志行转成 Annotations，无需登录即可通过 API 读取。
        shell: bash
        run: |
          set +e
          swift test --package-path Packages/DFData 2>&1 | tee /tmp/dfdata.log
          status=${PIPESTATUS[0]}
          echo "::notice title=DFDataStatus::exit=$status"
          if [ "$status" -ne 0 ]; then
            grep -E "error: |Test Case .* failed|XCTAssert.*failed|Fatal error|Assertion failed|recorded an issue" /tmp/dfdata.log \
              | head -n 6 \
              | while IFS= read -r line; do
                  echo "::error title=DFData::${line:0:900}"
                done
            {
              echo '```'
              tail -n 150 /tmp/dfdata.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
