name: diag-b1-05

# 临时诊断：B1-07 新挂起点定向取证（无缓冲输出 + 独立进程 + 超时取线程状态）。
# 仅手动触发；不配置 push / pull_request 等自动触发器。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - name: 安装系统依赖
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev python3 coreutils

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 记录版本与 TaskBox 标记
        shell: bash
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"; echo "GITHUB_REF=$GITHUB_REF"
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git rev-parse HEAD; swift --version
          echo "--- TaskBox 版本标记（应有 token/register）---"
          grep -n "func register(token" Packages/DFData/Sources/DFOrchestration/ChatOrchestratorImpl.swift || true
          echo "--- 生产探针条数（应为 0）---"
          grep -c "\[orch " Packages/DFData/Sources/DFOrchestration/ChatOrchestratorImpl.swift || echo 0

      - name: 构建测试目标
        run: swift build --package-path Packages/DFData --build-tests

      - name: 定向矩阵（无缓冲）
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY' 2>&1
          import os, re, signal, subprocess, time

          PKG = "Packages/DFData"
          BUDGET = 690
          started_all = time.time()

          groups = [
              ("1_s4d_2_only",   "ChatOrchestratorS4ExtraTests/testS4D_2_DoubleRetryRejected", 60),
              ("2_reference_all","ChatOrchestratorReferenceTests", 60),
              ("3_s4extra_all",  "ChatOrchestratorS4ExtraTests", 90),
              ("4_recovery_ref", "ChatOrchestratorRecoveryTests|ChatOrchestratorReferenceTests", 90),
              ("5_lifecycle_ref","ChatOrchestratorLifecycleTests|ChatOrchestratorReferenceTests", 90),
              ("6_all_orch",     "ChatOrchestrator", 120),
              ("7_full_dfdata",  None, 180),
          ]

          def descendants(pid):
              out = subprocess.run(["pgrep", "-P", str(pid)], capture_output=True, text=True).stdout.split()
              allp = list(out)
              for c in out:
                  allp += descendants(c)
              return allp

          def dump_state(pid):
              for p in [pid] + descendants(pid):
                  try:
                      print(f"--- ps -L pid={p} ---")
                      print(subprocess.run(["ps", "-o", "pid,tid,stat,wchan:28,comm", "-L", "-p", str(p)],
                                           capture_output=True, text=True).stdout)
                  except Exception as e:
                      print("ps failed", e)

          results = []
          for name, filt, cap in groups:
              remaining = BUDGET - (time.time() - started_all)
              limit = int(max(10, min(cap, remaining)))
              cmd = ["stdbuf", "-o0", "-e0", "swift", "test", "--package-path", PKG]
              if filt:
                  cmd += ["--filter", filt]
              print(f"\n===== GROUP {name} START {time.strftime('%H:%M:%S')} limit={limit}s =====", flush=True)
              print("CMD: " + " ".join(cmd), flush=True)
              t0 = time.time()
              p = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                   start_new_session=True, text=True, errors="replace", bufsize=1)
              timed_out = False
              try:
                  out, _ = p.communicate(timeout=limit)
                  code = p.returncode
              except subprocess.TimeoutExpired:
                  timed_out = True
                  dump_state(p.pid)
                  try:
                      os.killpg(os.getpgid(p.pid), signal.SIGKILL)
                  except Exception:
                      pass
                  out, _ = p.communicate()
                  code = 124
              dur = time.time() - t0
              open(f"/tmp/{name}.log", "w").write(out or "")
              started = re.findall(r"Test Case '([^']+)' started", out or "")
              passed = re.findall(r"Test Case '([^']+)' passed", out or "")
              failed = re.findall(r"Test Case '([^']+)' failed", out or "")
              exe = re.findall(r"Executed (\d+) tests?, with (\d+) failures", out or "")
              print(f"EXIT={code} TIMEOUT={timed_out} ELAPSED={dur:.1f}s", flush=True)
              print(f"COUNT started={len(started)} passed={len(passed)} failed={len(failed)}", flush=True)
              print(f"LAST_STARTED={started[-1] if started else 'NONE'}", flush=True)
              print(f"LAST_PASSED={passed[-1] if passed else 'NONE'}", flush=True)
              if exe:
                  print(f"EXECUTED={exe[-1]}", flush=True)
              if timed_out or failed:
                  print("--- TAIL 50 ---", flush=True)
                  for l in (out or "").splitlines()[-50:]:
                      print("TAIL " + l, flush=True)
              print(f"===== GROUP {name} END {time.strftime('%H:%M:%S')} =====", flush=True)
              results.append((name, code, timed_out, round(dur, 1), len(started), len(passed),
                              len(failed), started[-1] if started else "NONE",
                              passed[-1] if passed else "NONE"))

          print("\n\n========== SUMMARY (unbuffered) ==========", flush=True)
          for r in results:
              print(f"{r[0]:16} exit={r[1]:>4} to={str(r[2]):>5} {r[3]:>7}s start={r[4]:>3} pass={r[5]:>3} "
                    f"fail={r[6]:>3}\n    last_started={r[7]}\n    last_passed ={r[8]}", flush=True)
          print("========== END ==========", flush=True)
          PY
